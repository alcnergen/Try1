<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş yap — Vitrin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0b0f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/app/app.css">
  <script src="/app/giris.js" defer></script>
</head>
<body class="auth-page">
  <div class="auth-glow" aria-hidden="true"></div>
  <main class="auth">
    <a class="logo auth-logo" href="/" aria-label="Vitrin ana sayfa">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="url(#lg)"/>
        <path d="M9 10.5h14M10 10.5l1.4 12h9.2l1.4-12" fill="none" stroke="#1a0d05" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 14.5l1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z" fill="#1a0d05"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient></defs>
      </svg>
      <span>vitrin</span>
    </a>

    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title" data-title>Tekrar hoş geldin</h1>
      <p class="auth-sub" data-sub>Ürünlerini vitrine çıkarmaya kaldığın yerden devam et.</p>

      <form class="auth-form" novalidate data-form>
        <div class="field">
          <label for="email">E-posta</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="ornek@magazan.com" required>
        </div>
        <div class="field">
          <div class="field-row">
            <label for="password">Şifre</label>
            <a class="link-muted" href="mailto:merhaba@vitrin.app?subject=%C5%9Eifremi%20unuttum">Şifremi unuttum</a>
          </div>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="4">
            <button type="button" class="input-icon" aria-label="Şifreyi göster" aria-pressed="false" data-toggle-password>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
            </button>
          </div>
        </div>
        <p class="form-error" role="alert" data-error hidden></p>
        <button class="btn btn-primary btn-block btn-lg" type="submit" data-submit>
          <span data-submit-label>Giriş yap</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="demo-box">
        <div class="demo-head">
          <span class="demo-badge">Demo hesabı</span>
          <button type="button" class="btn btn-ghost btn-xs" data-fill-demo>Bilgileri doldur</button>
        </div>
        <dl>
          <div><dt>E-posta</dt><dd><code>demo@vitrin.app</code></dd></div>
          <div><dt>Şifre</dt><dd><code>vitrin2026</code></dd></div>
        </dl>
        <p>Ya da herhangi bir e-posta ve şifreyle gir; hesabın ilk girişte otomatik oluşturulur.</p>
      </div>
    </section>

    <p class="auth-foot"><a href="/">← Ana sayfaya dön</a></p>
  </main>
</body>
</html>
